schema_version: 1

context:
  name: trove-classifiers
  version: "2026.5.22.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5477e9974e91904fb2cfa4a7581ab6e2f30c2c38d847fd00ed866080748101d5

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - trove-classifiers = trove_classifiers.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - calver
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - trove_classifiers
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - trove-classifiers --help

about:
  summary: Canonical source for classifiers on PyPI (pypi.org).
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/pypa/trove-classifiers

extra:
  recipe-maintainers:
    - xylar
